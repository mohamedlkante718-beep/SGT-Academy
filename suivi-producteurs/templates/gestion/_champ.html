<div class="field champ-{{ champ.widget_type }}{% if champ.errors %} erreur{% endif %}">
  {% if champ.widget_type == "checkbox" %}
    <label class="case">{{ champ }} {{ champ.label }}</label>
  {% else %}
    <label for="{{ champ.id_for_label }}">{{ champ.label }}</label>
    {{ champ }}
  {% endif %}
  {% if champ.help_text %}<span class="aide">{{ champ.help_text }}</span>{% endif %}
  {{ champ.errors }}
</div>

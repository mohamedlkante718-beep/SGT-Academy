services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transit_carburant
      POSTGRES_PASSWORD: transit_carburant
      POSTGRES_DB: transit_carburant
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit_carburant"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://transit_carburant:transit_carburant@db:5432/transit_carburant
      JWT_SECRET: dev-secret-change-me
      ADMIN_BOOTSTRAP_MATRICULE: admin
      ADMIN_BOOTSTRAP_PASSWORD: admin1234
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media

volumes:
  db_data:
  media_data:

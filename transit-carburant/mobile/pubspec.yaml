name: transit_carburant
description: Contrôle numérique des citernes de carburant/gaz, de la frontière au dépôt.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3
  path: ^1.9.0
  http: ^1.2.2
  http_parser: ^4.1.2
  cryptography: ^2.7.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  mobile_scanner: ^6.0.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0F2A43"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#0F2A43"
  image: "assets/icon/app_icon_foreground.png"
  android_12:
    color: "#0F2A43"
    image: "assets/icon/app_icon_foreground.png"
